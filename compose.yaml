services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      STORE_DIRECT_DATABASE_URL: ${STORE_DIRECT_DATABASE_URL:-${DATABASE_URL}}
      STORE_DB_POOL_MODE: ${STORE_DB_POOL_MODE:-session}
      POOL_SIZE: ${POOL_SIZE:-10}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in the deployment environment}
      SENTRY_DSN: ${SENTRY_DSN:?Set SENTRY_DSN in the deployment environment}
      STORE_LOG_LEVEL: ${STORE_LOG_LEVEL:-info}
      STORE_LOG_FORMAT: ${STORE_LOG_FORMAT:-text}
      STORE_CSP_MODE: ${STORE_CSP_MODE:-disabled}
      STORE_CSP_POLICY: "${STORE_CSP_POLICY:-default-src 'self'; script-src 'self' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; connect-src 'self' https://api.stripe.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'}"
      STORE_CSP_REPORT_URI: ${STORE_CSP_REPORT_URI:-}
      STORE_TOKEN_SIGNING_SECRET: ${STORE_TOKEN_SIGNING_SECRET:?Set STORE_TOKEN_SIGNING_SECRET in the deployment environment}
      STORE_GOOGLE_CLIENT_ID: ${STORE_GOOGLE_CLIENT_ID:?Set STORE_GOOGLE_CLIENT_ID in the deployment environment}
      STORE_GOOGLE_CLIENT_SECRET: ${STORE_GOOGLE_CLIENT_SECRET:?Set STORE_GOOGLE_CLIENT_SECRET in the deployment environment}
      STORE_GOOGLE_REDIRECT_URI_BASE: ${STORE_GOOGLE_REDIRECT_URI_BASE:?Set STORE_GOOGLE_REDIRECT_URI_BASE in the deployment environment}
      STORE_QUOTE_HASH_SECRET: ${STORE_QUOTE_HASH_SECRET:?Set STORE_QUOTE_HASH_SECRET in the deployment environment}
      PHX_HOST: ${PHX_HOST:-example.com}
      ECTO_IPV6: ${ECTO_IPV6:-false}
      DNS_CLUSTER_QUERY: ${DNS_CLUSTER_QUERY:-}
      STORE_CLUSTER_TRANSPORT: ${STORE_CLUSTER_TRANSPORT:-inet6}
      STORE_TRUSTED_PROXY_PROXIES: ${STORE_TRUSTED_PROXY_PROXIES:-}
      STORE_TRUSTED_PROXY_HEADERS: ${STORE_TRUSTED_PROXY_HEADERS:-cf-connecting-ip,x-forwarded-for}
      STORE_PAYMENTS_ENABLED_PROVIDERS: ${STORE_PAYMENTS_ENABLED_PROVIDERS:-}
      STORE_PAYMENTS_DEFAULT_PURCHASE_PROVIDER_FOR_UI: ${STORE_PAYMENTS_DEFAULT_PURCHASE_PROVIDER_FOR_UI:-}
      STORE_STRIPE_WEBHOOK_SECRET: ${STORE_STRIPE_WEBHOOK_SECRET:-}
      STORE_STRIPE_SECRET_KEY: ${STORE_STRIPE_SECRET_KEY:-}
      STORE_STRIPE_PUBLISHABLE_KEY: ${STORE_STRIPE_PUBLISHABLE_KEY:-}
      STORE_STRIPE_API_BASE_URL: ${STORE_STRIPE_API_BASE_URL:-https://api.stripe.com}
      STORE_STRIPE_API_VERSION: ${STORE_STRIPE_API_VERSION:-2025-02-24.acacia}
      STORE_PAYMENT_TIMEOUT_MS: ${STORE_PAYMENT_TIMEOUT_MS:-5000}
      STORE_PAYMENT_PROVIDER_TASK_TIMEOUT_MS: ${STORE_PAYMENT_PROVIDER_TASK_TIMEOUT_MS:-4000}
      STORE_PAYMENT_HTTP_POOL_SIZE: ${STORE_PAYMENT_HTTP_POOL_SIZE:-400}
      STORE_PAYMENT_HTTP_RECEIVE_TIMEOUT_MS: ${STORE_PAYMENT_HTTP_RECEIVE_TIMEOUT_MS:-6000}
      STORE_PAYMENT_HTTP_POOL_TIMEOUT_MS: ${STORE_PAYMENT_HTTP_POOL_TIMEOUT_MS:-5000}
      STORE_COMMS_PROVIDER: ${STORE_COMMS_PROVIDER:-swoosh}
      STORE_POSTMARK_SERVER_TOKEN: ${STORE_POSTMARK_SERVER_TOKEN:-}
      STORE_POSTMARK_URL: ${STORE_POSTMARK_URL:-https://api.postmarkapp.com/email}
      STORE_COMMS_FROM_NAME: ${STORE_COMMS_FROM_NAME:-Store}
      STORE_COMMS_FROM_EMAIL: ${STORE_COMMS_FROM_EMAIL:-no-reply@example.com}
      STORE_COMMS_SUPPORT_EMAIL: ${STORE_COMMS_SUPPORT_EMAIL:-support@example.com}
      STORE_DIGITAL_STORAGE_PROVIDER: ${STORE_DIGITAL_STORAGE_PROVIDER:-s3}
      STORE_DIGITAL_ALLOWED_REDIRECT_HOSTS: ${STORE_DIGITAL_ALLOWED_REDIRECT_HOSTS:-downloads.example.com}
      STORE_DIGITAL_SIGNED_URL_TTL_SECONDS: ${STORE_DIGITAL_SIGNED_URL_TTL_SECONDS:-120}
      STORE_DIGITAL_DEFAULT_GRANT_TTL_DAYS: ${STORE_DIGITAL_DEFAULT_GRANT_TTL_DAYS:-30}
      STORE_DIGITAL_REFUND_REVOCATION_POLICY: ${STORE_DIGITAL_REFUND_REVOCATION_POLICY:-strict_line_scoped}
      STORE_DIGITAL_FAKE_HOST: ${STORE_DIGITAL_FAKE_HOST:-downloads.local}
      STORE_DIGITAL_S3_ACCESS_KEY_ID: ${STORE_DIGITAL_S3_ACCESS_KEY_ID:-}
      STORE_DIGITAL_S3_SECRET_ACCESS_KEY: ${STORE_DIGITAL_S3_SECRET_ACCESS_KEY:-}
      STORE_DIGITAL_S3_REGION: ${STORE_DIGITAL_S3_REGION:-us-east-1}
      STORE_DIGITAL_S3_HOST: ${STORE_DIGITAL_S3_HOST:-}
      STORE_DIGITAL_S3_SCHEME: ${STORE_DIGITAL_S3_SCHEME:-}
      STORE_DIGITAL_S3_PORT: ${STORE_DIGITAL_S3_PORT:-}
      STORE_RATE_LIMIT_BACKEND: ${STORE_RATE_LIMIT_BACKEND:-ets}
      STORE_WEBHOOK_RATE_LIMIT_LIMIT: ${STORE_WEBHOOK_RATE_LIMIT_LIMIT:-120}
      STORE_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS: ${STORE_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS:-60}
      STORE_ADMIN_RATE_LIMIT_LIMIT: ${STORE_ADMIN_RATE_LIMIT_LIMIT:-300}
      STORE_ADMIN_RATE_LIMIT_WINDOW_SECONDS: ${STORE_ADMIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      STORE_PUBLIC_WAITING_ROOM_LIMIT: ${STORE_PUBLIC_WAITING_ROOM_LIMIT:-380}
      STORE_PUBLIC_WAITING_ROOM_HARD_LIMIT: ${STORE_PUBLIC_WAITING_ROOM_HARD_LIMIT:-450}
      STORE_PUBLIC_WAITING_ROOM_WINDOW_SECONDS: ${STORE_PUBLIC_WAITING_ROOM_WINDOW_SECONDS:-10}
      STORE_LIVE_WAITING_ROOM_LIMIT: ${STORE_LIVE_WAITING_ROOM_LIMIT:-380}
      STORE_LIVE_WAITING_ROOM_HARD_LIMIT: ${STORE_LIVE_WAITING_ROOM_HARD_LIMIT:-450}
      STORE_LIVE_WAITING_ROOM_WINDOW_SECONDS: ${STORE_LIVE_WAITING_ROOM_WINDOW_SECONDS:-10}
      STORE_WAITING_ROOM_REFRESH_SECONDS: ${STORE_WAITING_ROOM_REFRESH_SECONDS:-10}
      STORE_DIGITAL_SIGNED_DOWNLOAD_LIMIT: ${STORE_DIGITAL_SIGNED_DOWNLOAD_LIMIT:-10}
      STORE_DIGITAL_SIGNED_DOWNLOAD_WINDOW_SECONDS: ${STORE_DIGITAL_SIGNED_DOWNLOAD_WINDOW_SECONDS:-60}
      STORE_WEBHOOK_RETENTION_DAYS: ${STORE_WEBHOOK_RETENTION_DAYS:-30}
      STORE_REDIS_HOST: ${STORE_REDIS_HOST:?Set STORE_REDIS_HOST in the deployment environment}
      STORE_REDIS_PORT: ${STORE_REDIS_PORT:-6379}
      STORE_REDIS_DB: ${STORE_REDIS_DB:-0}
      STORE_REDIS_USERNAME: ${STORE_REDIS_USERNAME:-}
      STORE_REDIS_PASSWORD: ${STORE_REDIS_PASSWORD:-}
      STORE_REDIS_SSL: ${STORE_REDIS_SSL:-false}
      PORT: "4000"
      PHX_SERVER: "true"
    ports:
      - "127.0.0.1:${STORE_HTTP_HOST_PORT:-4000}:4000"
    restart: unless-stopped
    init: true
