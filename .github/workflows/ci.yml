name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check_static:
    name: check_static
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix build and deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-beam-static-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-beam-static-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get

      - name: Run static check gate
        run: mix check.static

      - name: Verify no generated drift
        run: git diff --exit-code

  test_pr_strict:
    name: test_pr_strict
    runs-on: ubuntu-latest
    needs: check_static
    env:
      MIX_ENV: test
      STORE_DB_PORT: 5433

    services:
      postgres:
        image: postgres:16
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        options: >-
          --health-cmd "pg_isready -U postgres -d store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix build and deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-beam-test-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-beam-test-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            nc -z localhost 5433 && exit 0
            sleep 1
          done
          echo "Postgres did not become ready on port 5433"
          exit 1

      - name: Run strict PR tests
        run: mix test --max-failures 1

      - name: Verify no generated drift
        run: git diff --exit-code

  dialyzer_required:
    name: dialyzer_required
    runs-on: ubuntu-latest
    needs: check_static
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix build, deps, and PLTs
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
            priv/plts
          key: ${{ runner.os }}-beam-dialyzer-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-beam-dialyzer-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get

      - name: Run required Dialyzer gate
        run: mix check.types

      - name: Verify no generated drift
        run: git diff --exit-code
