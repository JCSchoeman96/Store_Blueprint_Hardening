name: Nightly Hardening

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  heavy_tests:
    name: heavy_tests_seed_${{ matrix.seed }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      STORE_DB_PORT: 55433
      STORE_TEST_DATABASE_PASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 55433
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: store_blueprint_test
      MIX_TEST_PARTITION: 1

    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]

    services:
      postgres:
        image: postgres:18
        ports:
          - 55433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_blueprint_test
        options: >-
          --health-cmd "pg_isready -U postgres -d store_blueprint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 56380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix build and deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-beam-nightly-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-beam-nightly-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_isready --version

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" && exit 0
            sleep 1
          done
          echo "Postgres did not become ready on ${PGHOST}:${PGPORT}"
          exit 1

      - name: Create least-privilege test role
        run: |
          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U postgres -d postgres \
            -c "CREATE ROLE store_blueprint_test LOGIN PASSWORD 'postgres' NOSUPERUSER NOCREATEROLE CREATEDB"
          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U postgres -d postgres \
            -c "ALTER DATABASE store_blueprint_test OWNER TO store_blueprint_test"
          role_capabilities=$(PGPASSWORD="$STORE_TEST_DATABASE_PASSWORD" psql \
            -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U store_blueprint_test \
            -d "$PGDATABASE" -Atqc \
            "SELECT rolsuper = false AND rolcreatedb = true FROM pg_roles WHERE rolname = current_user")
          test "$role_capabilities" = "t"

      - name: Run nightly strict suite (seeded)
        run: |
          mkdir -p tmp/nightly
          mix test --seed ${{ matrix.seed }} --max-failures 1 | tee tmp/nightly/tests-seed-${{ matrix.seed }}.log

      - name: Run nightly replay/property/perf focus suites
        run: |
          mkdir -p tmp/nightly
          mix test \
            test/store/subscriptions/scheduler_property_test.exs \
            test/store/subscriptions/replay_concurrency_test.exs \
            test/store/subscriptions/performance_test.exs \
            --seed ${{ matrix.seed }} \
            --max-cases 1 \
            --max-failures 1 \
            | tee tmp/nightly/focus-seed-${{ matrix.seed }}.log

      - name: Run renewal replay stress loop
        run: |
          mkdir -p tmp/nightly
          for i in 1 2 3; do
            mix test test/store/subscriptions/replay_concurrency_test.exs \
              --seed ${{ matrix.seed }} \
              --max-cases 1 \
              --max-failures 1 \
              | tee -a tmp/nightly/replay-stress-seed-${{ matrix.seed }}.log
          done

      - name: Initialize isolated performance database
        env:
          STORE_PERF_SMOKE: "true"
          STORE_PERF_DATABASE_NAME: store_blueprint_perf
          STORE_PERF_DATABASE_HOST: 127.0.0.1
          STORE_PERF_DATABASE_PORT: 55433
          STORE_PERF_REDIS_HOST: 127.0.0.1
          STORE_PERF_REDIS_PORT: 56380
          STORE_PERF_REDIS_DB: "0"
        run: mix ash_postgres.create && mix ash_postgres.migrate

      - name: Run nightly full-stress performance smoke
        env:
          STORE_PERF_SMOKE: "true"
          STORE_PERF_PROFILE: full_stress
          STORE_PERF_CHAOS_PROFILE: provider_incident
          STORE_PERF_CHAOS_SEED: nightly-provider-incident
          STORE_PERF_DATABASE_NAME: store_blueprint_perf
          STORE_PERF_DATABASE_HOST: 127.0.0.1
          STORE_PERF_DATABASE_PORT: 55433
          STORE_PERF_REDIS_HOST: 127.0.0.1
          STORE_PERF_REDIS_PORT: 56380
          STORE_PERF_REDIS_DB: "0"
        run: |
          mkdir -p tmp/nightly
          mix run --no-start priv/repo/performance_smoke_test.exs \
            | tee tmp/nightly/performance-smoke-seed-${{ matrix.seed }}.log

      - name: Upload nightly test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-logs-seed-${{ matrix.seed }}
          path: |
            tmp/nightly/tests-seed-${{ matrix.seed }}.log
            tmp/nightly/focus-seed-${{ matrix.seed }}.log
            tmp/nightly/replay-stress-seed-${{ matrix.seed }}.log
            tmp/nightly/performance-smoke-seed-${{ matrix.seed }}.log
            tmp/perf/

  dialyzer_nightly:
    name: dialyzer_nightly
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache Mix build, deps, and PLTs
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
            priv/plts
          key: ${{ runner.os }}-beam-nightly-dialyzer-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-beam-nightly-dialyzer-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get

      - name: Run nightly Dialyzer gate
        run: mix check.types
